[package]
name = "runyte-desktop"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "runyte-desktop"
path = "src/main.rs"

[[bin]]
name = "runyte-app-launcher"
path = "src/app_launcher.rs"
required-features = ["app-launcher"]

[features]
# Built explicitly for macOS bundles; omitted from ordinary desktop builds.
app-launcher = []

[dependencies]
anyhow = "1.0"
runyte = { path = "../.." }
runyte-native = { path = "../runyte-native" }
runyte-preview = { path = "../runyte-preview" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
