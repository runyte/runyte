        target: enter-normal-mode
      Ctrl-\:
        steps:
          - fit-selection-for-normal-mode
          - action: mode-enter
            arg: normal
        target: enter-normal-mode
      Ctrl-4:
        steps:
          - fit-selection-for-normal-mode
          - action: mode-enter
            arg: normal
        target: enter-normal-mode
        role: compatibility
      ':': open-command-palette
      h: move-left
      Left: move-left
      j: move-down
      Down: move-down
      k: move-up
      Up: move-up
      l: move-right
      Right: move-right
      w: move-word-forward
      b: move-word-backward
      e: move-word-end
      W: move-long-word-forward
      B: move-long-word-backward
      E: move-long-word-end
      f: find-next-char
      F: find-previous-char
      t: find-till-next-char
      T: find-till-previous-char
      Home: move-line-start
      End: move-line-end
      '0': move-line-start
      ^: move-first-non-whitespace
      $: move-line-end
      Ctrl-b: page-up
      PageUp: page-up
      Ctrl-f: page-down
      PageDown: page-down
      Ctrl-u: half-page-up
      Ctrl-d: half-page-down
      i: enter-insert-mode
      a: append-after
      I: insert-line-start
      A: insert-line-end
      o: open-line-below
      O: open-line-above
      r:
        - replace-char
        - action: mode-enter
          arg: normal
      R: enter-replace-mode
      '~':
        - toggle-case
        - action: mode-enter
          arg: normal
      Alt-u: selection-undo
      Alt-U: selection-redo
      Space s u:
        steps:
          - selection-undo
        alias: Alt-u
      Space s U:
        steps:
          - selection-redo
        alias: Alt-U
      u: undo
      U: redo
      y: yank-collapse-normal-mode
      Y: yank-line-collapse-normal-mode
      p: paste-after-or-replace
      P: paste-before
      '>': indent
      <: unindent
      Ctrl-c: toggle-comments
      d:
        - cut-selection
        - action: mode-enter
          arg: normal
      c:
        - cut-selection-for-change
        - action: mode-enter
          arg: insert
      v:
        steps:
          - if:
              mode: select
            then:
              - collapse-selection
              - action: mode-enter
                arg: normal
            else:
              - enter-select-mode
        description: Toggle Select; collapse when leaving
        target: enter-select-mode
      x: select-line
      X: extend-line-above
      '%':
        - select-all
        - action: mode-enter
          arg: select
      ;:
        - collapse-selection
        - action: mode-enter
          arg: normal
      Alt-;:
        - flip-selection
        - action: mode-enter
          arg: select
      ',': keep-primary-selection
      Alt-,: remove-primary-selection
      C: copy-selection-down
      Alt-C: copy-selection-up
      V: copy-selection-down-padded
      Alt-V: copy-selection-up-padded
      ): rotate-selection-forward
      (: rotate-selection-backward
      Alt-): rotate-selection-contents-forward
      Alt-(: rotate-selection-contents-backward
      '&': align-selections
      _: trim-trailing-whitespace
      Alt-_: trim-selections
      Space p w: hard-wrap
      Space p r: reflow
      Space p s: toggle-soft-wrap
      Space p .: toggle-whitespace
      Space p j: join-selections
      J: join-lines
      Space p t: format-table
      s: search
      /: search-regex
      n: search-next
      N: search-previous
