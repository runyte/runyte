# SPDX-License-Identifier: MPL-2.0

name: Binary release

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      targets: ${{ steps.release.outputs.targets }}
      windows: ${{ steps.release.outputs.windows }}
      desktop: ${{ steps.release.outputs.desktop }}
      terminal_prefix: ${{ steps.release.outputs.terminal_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and package version
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH: $REQUESTED_TAG" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${REQUESTED_TAG}^{commit}" >/dev/null; then
            echo "release tag does not exist: $REQUESTED_TAG" >&2
            exit 1
          fi

          source_sha="$(git rev-parse "refs/tags/${REQUESTED_TAG}^{commit}")"
          git checkout --detach "$source_sha"

          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" \
                '.packages[] | select(.manifest_path == $manifest) | .version'
          )"
          if [[ -z "$version" || "$version" == null ]]; then
            echo "could not read the runyte package version" >&2
            exit 1
          fi
          if [[ "$REQUESTED_TAG" != "v${version}" ]]; then
            echo "tag $REQUESTED_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

          targets='[{"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"},{"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-22.04-arm"},{"target":"x86_64-apple-darwin","runner":"macos-15-intel"},{"target":"aarch64-apple-darwin","runner":"macos-15"}]'
          desktop=false
          terminal_prefix=runyte
          if test -f crates/runyte-desktop/Cargo.toml; then
            terminal_prefix=runyte-terminal
            desktop=true
          fi
          windows=false
          # Retrying a historical tag must retain its original platform set.
          if test -f src/terminal/pty_windows.rs; then
            windows=true
            targets="$(jq -c '. + [{"target":"x86_64-pc-windows-msvc","runner":"windows-latest"}]' <<< "$targets")"
          fi

          {
            echo "tag=$REQUESTED_TAG"
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "targets=$targets"
            echo "windows=$windows"
            echo "desktop=$desktop"
            echo "terminal_prefix=$terminal_prefix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Build exact tagged source
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          TERMINAL_PREFIX: ${{ needs.validate.outputs.terminal_prefix }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          output="$("target/${TARGET}/release/runyte${EXE_SUFFIX}" --version)"
          expected="runyte $VERSION"
          if test -f crates/runyte-desktop/Cargo.toml; then
            expected="$expected (terminal edition)"
          fi
          test "$output" = "$expected"

      - name: Package archive
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          TERMINAL_PREFIX: ${{ needs.validate.outputs.terminal_prefix }}
        shell: bash
        run: |
          set -euo pipefail

          archive="${TERMINAL_PREFIX}-${RELEASE_TAG}-${TARGET}.tar.xz"
          package_root="$RUNNER_TEMP/runyte-package"
          package_dir="$package_root/${TERMINAL_PREFIX}-${VERSION}-${TARGET}"
          archive_path="$RUNNER_TEMP/$archive"

          mkdir -p "$package_dir"
          install -m 0755 "target/${TARGET}/release/runyte" "$package_dir/runyte"
          # runed is runyte started under another name, which means --editor.
          ln -s runyte "$package_dir/runed"
          install -m 0644 \
            README.md \
            LICENSE \
            NOTICE \
            THIRD_PARTY_NOTICES.md \
            config.example.yaml \
            "$package_dir/"
          cp -R licenses "$package_dir/licenses"
          mkdir -p "$package_dir/docs"
          install -m 0644 docs/user-guide.md "$package_dir/docs/user-guide.md"

          COPYFILE_DISABLE=1 tar -C "$package_root" -cJf "$archive_path" \
            "${TERMINAL_PREFIX}-${VERSION}-${TARGET}"
          tar -tJf "$archive_path"
          "$package_dir/runyte" --version
          "$package_dir/runed" --version

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          TERMINAL_PREFIX: ${{ needs.validate.outputs.terminal_prefix }}
        run: |
          $packageName = "$env:TERMINAL_PREFIX-$env:VERSION-$env:TARGET"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item -LiteralPath "target/$env:TARGET/release/runyte.exe" -Destination $packageDir
          # A zip archive holds no links, so runed.exe is a copy; started as
          # runed it runs as runyte --editor.
          Copy-Item -LiteralPath "target/$env:TARGET/release/runyte.exe" -Destination (Join-Path $packageDir "runed.exe")
          Copy-Item -LiteralPath README.md, LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, config.example.yaml -Destination $packageDir
          Copy-Item -LiteralPath licenses -Destination $packageDir -Recurse
          New-Item -ItemType Directory -Path "$packageDir/docs" | Out-Null
          Copy-Item -LiteralPath docs/user-guide.md -Destination "$packageDir/docs/user-guide.md"
          New-Item -ItemType Directory -Path "$packageDir/contrib" | Out-Null
          Copy-Item -LiteralPath contrib/runyte.ps1 -Destination "$packageDir/contrib/runyte.ps1"
          Compress-Archive -LiteralPath $packageDir -DestinationPath "$env:RUNNER_TEMP/$env:TERMINAL_PREFIX-$env:RELEASE_TAG-$env:TARGET.zip"
          & "$packageDir/runyte.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packaged archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ needs.validate.outputs.terminal_prefix }}-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.xz' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop:
    name: Build and accept Linux x86-64 desktop
    needs: validate
    if: needs.validate.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Native build and acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libssl-dev \
            libvulkan1 mesa-vulkan-drivers xvfb xauth libxtst6 fonts-dejavu-core
          lvp_icds=(/usr/share/vulkan/icd.d/lvp*.json)
          test "${#lvp_icds[@]}" -eq 1
          test -f "${lvp_icds[0]}"
          printf 'VK_DRIVER_FILES=%s\n' "${lvp_icds[0]}" >> "$GITHUB_ENV"
      - name: Stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build desktop executable from the release tag
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo build --release --locked -p runyte-desktop
      - name: Package and accept the extracted desktop archive
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          TERMINAL_PREFIX: ${{ needs.validate.outputs.terminal_prefix }}
        run: |
          package_name="runyte-desktop-${VERSION}-x86_64-unknown-linux-gnu"
          archive="$RUNNER_TEMP/runyte-desktop-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.xz"
          python3 -m unittest discover -s contrib/packaging -p 'test_*.py'
          python3 contrib/packaging/package.py linux --binary target/release/runyte-desktop \
            --output "$RUNNER_TEMP/$package_name"
          tar -C "$RUNNER_TEMP" -cJf "$archive" "$package_name"
          mkdir "$RUNNER_TEMP/extracted"
          tar -C "$RUNNER_TEMP/extracted" -xJf "$archive"
          xvfb-run -a -s '-screen 0 3200x1800x24' python3 contrib/packaging/check_package.py \
            "$RUNNER_TEMP/extracted/$package_name" --window
      - name: Upload accepted desktop archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/runyte-desktop-${{ needs.validate.outputs.tag }}-x86_64-unknown-linux-gnu.tar.xz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [validate, build, desktop]
    if: always() && needs.validate.result == 'success' && needs.build.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download packaged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify archives and generate checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TERMINAL_PREFIX: ${{ needs.validate.outputs.terminal_prefix }}
          WINDOWS: ${{ needs.validate.outputs.windows }}
          DESKTOP: ${{ needs.validate.outputs.desktop }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE_SHA"

          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "dist/${TERMINAL_PREFIX}-${RELEASE_TAG}-${target}.tar.xz"
          done
          test "$(find dist -maxdepth 1 -type f -name "${TERMINAL_PREFIX}-v*.tar.xz" | wc -l)" -eq 4
          expected=4
          if [[ "$WINDOWS" == true ]]; then
            test -f "dist/${TERMINAL_PREFIX}-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
            test "$(find dist -maxdepth 1 -type f -name 'runyte-*.zip' | wc -l)" -eq 1
            expected=5
          else
            test "$(find dist -maxdepth 1 -type f -name 'runyte-*.zip' | wc -l)" -eq 0
          fi

          if [[ "$DESKTOP" == true ]]; then
            test -f "dist/runyte-desktop-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.xz"
            expected=$((expected + 1))
          fi

          (
            cd dist
            shopt -s nullglob
            sha256sum runyte-*.tar.xz runyte-*.zip | sort -k2 > SHA256SUMS
          )
          test "$(wc -l < dist/SHA256SUMS)" -eq "$expected"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          TERMINAL_PREFIX: ${{ needs.validate.outputs.terminal_prefix }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Runyte $VERSION"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "Runyte $VERSION" \
              --notes "Prebuilt archives are attached. Verify the selected archive with SHA256SUMS. Supported platforms and limitations are documented in the packaged README and user guide. The macOS and Windows executables are unsigned."
          fi
