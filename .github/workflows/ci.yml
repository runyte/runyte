# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    branches: [main, dev, feat/windows-support]
  pull_request:
    branches: [main, dev]

# No job here needs to write to the repository. Declaring the floor once means
# any future workflow that does need write access has to say so deliberately.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. Cancelling it
# frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-msvc
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test native editing, Git and ConPTY
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/runyte-test-config
        run: cargo test --locked
      - name: Provision the required native language server
        run: |
          rustup component add rust-analyzer rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rust-analyzer --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Accept native language-server approval and lifecycle
        run: |
          cargo test --locked --test lsp_windows_acceptance real_rust_analyzer_permission_diagnostics_edits_restart_and_cleanup -- --ignored --exact 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-lsp-acceptance.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $acceptance = Get-Content -Raw "$env:RUNNER_TEMP/native-lsp-acceptance.log"
          if ($acceptance -notmatch 'test real_rust_analyzer_permission_diagnostics_edits_restart_and_cleanup \.\.\. ok') {
            throw 'Required native language-server acceptance did not run'
          }
      # Windows coverage is provisional and has no measured baseline yet.
      # The Linux/macOS jobs continue enforcing the unchanged 89% floor.

  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install advisory checker
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Check locked dependencies
        run: cargo audit --deny unsound

  gates:
    name: Gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tree-sitter grammar crate runs a build script. Leaving the
          # job token in .git/config would put it within reach of one.
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  plugin-conformance:
    name: Plugin conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: plugin-conformance-${{ matrix.os }}

      - name: Test compatibility gate tools
        run: python3 -m unittest discover -s docs/plugins/compatibility -p 'test_*.py' -v

      - name: Prepare the exact host or pre-stable candidate
        id: candidate
        run: python3 docs/plugins/compatibility/candidate.py --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"

      - name: Install Linux example backends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mpv nodejs build-essential pkg-config libjson-c-dev

      - name: Install macOS example backends
        if: runner.os == 'macOS'
        run: brew install mpv node pkg-config json-c

      - name: Build and lint native todo examples
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          python3 docs/plugins/todo/build.py
          cargo fmt --manifest-path docs/plugins/todo/rust/Cargo.toml --check
          cargo clippy --locked --manifest-path docs/plugins/todo/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path docs/plugins/todo/rust/Cargo.toml

      - name: Validate plugin contracts and examples
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          python3 -m venv "$RUNNER_TEMP/plugin-schema"
          plugin_schema_python="$RUNNER_TEMP/plugin-schema/bin/python"
          "$plugin_schema_python" -m pip install jsonschema==4.23.0 -r docs/plugins/requirements-sftp.txt -r docs/plugins/requirements-ftp-test.txt
          "$plugin_schema_python" docs/plugins/check_all.py --require-backends
          (cd bridges/runyte-context && "$plugin_schema_python" -m unittest discover -s tests -v)

      # The checks above play the host themselves. This starts every example in
      # a real persistent host, using the same Python environment for Paramiko.
      - name: Start every example in a real host
        working-directory: ${{ steps.candidate.outputs.source }}
        env:
          RUNYTE_EXAMPLE_PYTHON: ${{ runner.temp }}/plugin-schema/bin/python
        run: |
          set -o pipefail
          cargo test --locked --test persistent_host plugin_examples::every_example_plugin_registers_and_stays_running_in_a_real_host -- --ignored --exact | tee "$RUNNER_TEMP/plugin-examples.log"
          python3 -c 'import pathlib, sys; text = pathlib.Path(sys.argv[1]).read_text(); assert "test plugin_examples::every_example_plugin_registers_and_stays_running_in_a_real_host ... ok" in text, "required native example test did not run"' "$RUNNER_TEMP/plugin-examples.log"

      - name: Exercise two MCP clients against real editor hosts
        working-directory: ${{ steps.candidate.outputs.source }}
        env:
          RUNYTE_CONTEXT_TEST_BINARY: ${{ github.workspace }}/target/debug/runyte
        run: |
          test -x "$RUNYTE_CONTEXT_TEST_BINARY"
          cd bridges/runyte-context
          "$RUNNER_TEMP/plugin-schema/bin/python" -m unittest discover -s tests -p test_runyte.py -v

  ru-time:
    name: ru-time moving head against this commit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Moving external development is advisory. Immutable supported plugins run
    # separately in the required frozen-plugin job below.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ru-time-${{ matrix.os }}

      - name: Prepare the exact host or pre-stable candidate
        id: candidate
        run: python3 docs/plugins/compatibility/candidate.py --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runyte/ru-time
          path: ru-time
          persist-credentials: false

      - name: Build Runyte
        working-directory: ${{ steps.candidate.outputs.source }}
        run: cargo build --locked

      # RUNYTE_BIN enables ru-time's real-editor test, which is skipped otherwise.
      - name: Test ru-time
        working-directory: ru-time
        env:
          RUNYTE_BIN: ${{ github.workspace }}/target/debug/runyte
        run: python3 -m unittest discover -s tests -v

  plugin-inventory:
    name: Immutable plugin inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plugins: ${{ steps.pins.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Retained SDK source revisions must resolve to the recorded bytes.
          fetch-depth: 0
      - name: Validate retained profiles and immutable source provenance
        id: pins
        run: python3 docs/plugins/compatibility/check_inventory.py --verify-upstream --github-output "$GITHUB_OUTPUT"

  frozen-plugin:
    name: Frozen plugin ${{ matrix.plugin.id }} (${{ matrix.os }})
    needs: plugin-inventory
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        plugin: ${{ fromJSON(needs.plugin-inventory.outputs.plugins) }}
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: frozen-${{ matrix.os }}-${{ matrix.plugin.revision }}
      - name: Prepare the exact host or pre-stable candidate
        id: candidate
        run: python3 docs/plugins/compatibility/candidate.py --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.plugin.repository }}
          ref: ${{ matrix.plugin.revision }}
          path: frozen-plugin
          persist-credentials: false
          fetch-depth: 0
      - name: Build the host under test
        working-directory: ${{ steps.candidate.outputs.source }}
        run: cargo build --locked
      - name: Install isolated schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/frozen-schema"
          "$RUNNER_TEMP/frozen-schema/bin/python" -m pip install jsonschema==4.23.0
      - name: Verify frozen schemas, SDK and real editor behavior
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          "$RUNNER_TEMP/frozen-schema/bin/python" docs/plugins/compatibility/check_frozen.py --checkout "$GITHUB_WORKSPACE/frozen-plugin" --plugin '${{ matrix.plugin.id }}' --host-bin "$CARGO_TARGET_DIR/debug/runyte" --host-version '${{ steps.candidate.outputs.host_version }}'

  coverage:
    name: Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-${{ matrix.os }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none

      # Run the ordinary test suite under instrumentation first so the same
      # collected profile can produce both the compact summary and HTML report.
      - name: Measure coverage
        run: cargo llvm-cov --locked --workspace --no-report

      - name: Generate coverage reports
        run: |
          cargo llvm-cov report --html
          cargo llvm-cov report | tee coverage-summary.txt
          {
            echo '### Rust coverage'
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
            echo
            echo 'The enforced line-coverage floor is **89%**.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-html-${{ matrix.os }}
          path: |
            target/llvm-cov/html
            coverage-summary.txt
          if-no-files-found: error
          retention-days: 14

      # The 89% floor leaves 2.21 percentage points of supported-platform
      # headroom below the current 91.21% macOS baseline, which is the lower
      # of the two measured targets, while turning a material coverage
      # regression red much sooner than the 86% it replaces.
      - name: Enforce line coverage baseline
        run: cargo llvm-cov report --fail-under-lines 89

  macos:
    name: Tests (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Persistent-session and PTY tests spawn real child processes. Preserve
      # the async caller when a platform-specific lifecycle wait fails.
      RUST_BACKTRACE: 1
      # The default macOS temp directory is a long `/var/folders/...` path
      # whose canonical spelling starts with `/private`. Tests create many
      # path fixtures and Unix sockets below it, so use the short canonical
      # system temp directory to keep identities stable and socket paths valid.
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # PTY handling and terminal emulation are where macOS and Linux diverge,
      # so the suite runs in full here rather than just building.
      - name: Test
        run: cargo test --locked

  lifecycle-stress:
    name: Lifecycle stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUST_BACKTRACE: 1
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lifecycle-stress-${{ matrix.os }}

      # This is a burn-in gate, not a retry: `bash -e` stops on the first
      # failure, so every invocation and every attempt must pass. The suites
      # retain their normal parallelism and production deadlines.
      - name: Repeat process and PTY integration suites
        run: |
          set -o pipefail
          for attempt in {1..10}; do
            echo "burn-in attempt ${attempt}/10" | tee -a lifecycle-stress.log
            cargo test --locked --test local_protocol 2>&1 | tee -a lifecycle-stress.log
            cargo test --locked --test diagnostic_log 2>&1 | tee -a lifecycle-stress.log
            cargo test --locked --test persistent_host 2>&1 | tee -a lifecycle-stress.log
            cargo test --locked --test workspace_bulk 2>&1 | tee -a lifecycle-stress.log
          done

      - name: Upload lifecycle failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-stress-${{ matrix.os }}
          path: lifecycle-stress.log
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Performance (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: performance

      # Wall-clock budgets cannot distinguish a regression from sibling tests
      # taking the runner's CPU. Release mode is the user-facing build, and one
      # test thread gives every budget the machine rather than a noisy share.
      - name: Test serialized release budgets
        run: cargo test --release --locked --test performance -- --ignored --test-threads=1

  floor:
    name: Release build floor (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Linux release artifacts are built on 22.04 so they inherit its glibc
      # 2.35 floor. This job is the early warning that the image still builds:
      # it fails on an ordinary push rather than during a release.
      - name: Build
        run: cargo build --release --locked

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup ships on the runner image, so pinning a toolchain needs no
      # third-party action.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      # Keeps `rust-version = "1.88"` in Cargo.toml honest.
      - name: Check
        run: cargo +1.88 check --all-targets --locked
