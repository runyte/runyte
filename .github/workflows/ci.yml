# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    branches: [main, feat/windows-support]
  pull_request:
    branches: [main, dev, exp]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# No job here needs to write to the repository. Declaring the floor once means
# any future workflow that does need write access has to say so deliberately.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. Cancelling it
# frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly-dev' || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Resolve CI source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
      - id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  installer:
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false
      - name: Check shell syntax
        run: sh -n install.sh
      - name: Test installation and updates offline
        run: python3 -m unittest discover -s tests/installer -v

  windows:
    # A failed source resolver must fail required checks, not skip them green.
    if: ${{ !cancelled() }}
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Match native acceptance's resource envelope. Tests that verify process
      # overlap create their own concurrent children within this runner limit.
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-msvc
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Compile native tests
        run: cargo test --locked --no-run --timings
      - name: Retain Windows build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7
      - name: Test native editing, Git and ConPTY
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/runyte-test-config
        run: cargo test --locked --no-fail-fast
      - name: Require successful restart and characterize save visibility
        if: ${{ !cancelled() }}
        # Restart provisions a nested breakaway job inside a non-breakaway
        # kill-on-close owner. Unsupported runner policy fails, never skips.
        run: |
          $cases = @(
            @('windows_session_cli', 'restart_success_replaces_host_and_preserves_protected_state'),
            @('windows_session_cli', 'restart_refuses_detached_policy_without_breakaway_job'),
            @('windows_save_visibility', 'successful_saves_have_complete_contents_after_acknowledgement')
          )
          foreach ($entry in $cases) {
            $target = $entry[0]
            $case = $entry[1]
            cargo test --locked --test $target $case -- --exact --show-output 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/$case.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $acceptance = Get-Content -Raw "$env:RUNNER_TEMP/$case.log"
            if ($acceptance -notmatch ('test ' + [regex]::Escape($case) + ' \.\.\. ok')) {
              throw "Required native acceptance did not run: $case"
            }
          }
      - name: Accept built-in MCP against the public Windows editor
        if: ${{ !cancelled() }}
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          $env:RUNYTE_CONTEXT_TEST_PYTHON = (Get-Command python -ErrorAction Stop).Source
          $case = 'public_windows_context_round_trip'
          cargo test --locked --test windows_context_acceptance $case -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-context-public.log"
          $publicExit = $LASTEXITCODE
          if ($publicExit -ne 0) {
            $failures.Add("Public Windows context acceptance exited with $publicExit")
          }
          $publicAcceptance = Get-Content -Raw "$env:RUNNER_TEMP/windows-context-public.log"
          if ($publicAcceptance -notmatch ('test ' + [regex]::Escape($case) + ' \.\.\. ok')) {
            $failures.Add("Required public Windows context acceptance did not run: $case")
          }
          if ($failures.Count -ne 0) {
            throw ($failures -join [Environment]::NewLine)
          }
      - name: Accept isolated native clipboard operations
        if: ${{ !cancelled() }}
        # Named private window stations require administrator privileges;
        # hosted Windows runners provide them. Never use the user's clipboard.
        run: |
          $cases = @(
            'clipboard::windows::tests::native_clipboard_round_trip',
            'clipboard::windows::image_tests::native_images_use_the_bounded_worker_on_an_isolated_desktop',
            'clipboard::windows::tests::concurrent_fixture_children_keep_distinct_clipboards'
          )
          foreach ($case in $cases) {
            cargo test --locked --lib $case -- --ignored --exact 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-clipboard-acceptance.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $acceptance = Get-Content -Raw "$env:RUNNER_TEMP/native-clipboard-acceptance.log"
            $required = 'test ' + [regex]::Escape($case) + ' \.\.\. ok'
            if ($acceptance -notmatch $required) {
              throw "Required native clipboard acceptance did not run: $case"
            }
          }
      - name: Provision the required native language server
        run: |
          rustup component add rust-analyzer rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rust-analyzer --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Accept native language-server approval and lifecycle
        run: |
          cargo test --locked --test lsp_windows_acceptance real_rust_analyzer_permission_diagnostics_edits_restart_and_cleanup -- --ignored --exact 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-lsp-acceptance.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $acceptance = Get-Content -Raw "$env:RUNNER_TEMP/native-lsp-acceptance.log"
          if ($acceptance -notmatch 'test real_rust_analyzer_permission_diagnostics_edits_restart_and_cleanup \.\.\. ok') {
            throw 'Required native language-server acceptance did not run'
          }
      # Windows coverage is provisional and has no measured baseline yet.
      # The Linux/macOS jobs continue enforcing the unchanged 89% floor.

  security:
    # A failed source resolver must fail required checks, not skip them green.
    if: ${{ !cancelled() }}
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false
      - name: Install advisory checker
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Check locked dependencies
        run: cargo audit --deny unsound

  gates:
    # A failed source resolver must fail required checks, not skip them green.
    if: ${{ !cancelled() }}
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          # Every tree-sitter grammar crate runs a build script. Leaving the
          # job token in .git/config would put it within reach of one.
          persist-credentials: false

      # Nightlies test dev source with helpers from the workflow revision.
      # Keep the source tree and its own packaging invariants unchanged.
      - name: Check out CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: Keep helper checkout out of candidate source snapshots
        run: echo '/.ci-tools/' >> .git/info/exclude

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-ubuntu-latest

      - name: Check CI policy and artifact handling
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-policy"
          "$RUNNER_TEMP/ci-policy/bin/pip" install PyYAML==6.0.2
          "$RUNNER_TEMP/ci-policy/bin/python" -m unittest discover -s .ci-tools/.github/scripts -p 'test_*.py' -v

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test with coverage and enforce the baseline
        uses: ./.ci-tools/.github/actions/core-coverage
        with:
          runner: ubuntu-latest

  plugin-conformance:
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Plugin conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      # Nightlies test dev source with helpers from the workflow revision.
      # Keep the source tree and its own packaging invariants unchanged.
      - name: Check out CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: Keep helper checkout out of candidate source snapshots
        run: echo '/.ci-tools/' >> .git/info/exclude

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: plugin-conformance-${{ matrix.os }}

      - name: Check user guide navigation and links
        run: python3 contrib/check_user_guide.py

      - name: Test compatibility gate tools
        run: python3 -m unittest discover -s docs/plugins/compatibility -p 'test_*.py' -v

      - name: Prepare the exact host or 0.4 candidate
        id: candidate
        run: python3 docs/plugins/compatibility/candidate.py --candidate-version 0.4.0 --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"

      - name: Install Linux example backends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mpv nodejs build-essential pkg-config cmake

      # The distro's json-c 0.18 rejects non-ASCII strings in strict mode.
      # Keep strict UTF-8 parsing and build the supported release privately.
      - name: Check out json-c 0.19
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: json-c/json-c
          ref: aa716cd8d663c976b99b0f30f102ee1d8ef63146 # json-c-0.19-20260627
          path: .ci-deps/json-c
          persist-credentials: false

      - name: Build and test json-c 0.19
        if: runner.os == 'Linux'
        run: |
          cmake -S .ci-deps/json-c -B "$RUNNER_TEMP/json-c-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/json-c" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/json-c-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/json-c-build" --output-on-failure
          cmake --install "$RUNNER_TEMP/json-c-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/json-c/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/json-c/lib" >> "$GITHUB_ENV"

      - name: Install macOS example backends
        if: runner.os == 'macOS'
        run: brew install mpv node pkg-config json-c

      - name: Build and lint native todo examples
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          python3 docs/plugins/todo/build.py
          cargo fmt --manifest-path docs/plugins/todo/rust/Cargo.toml --check
          cargo clippy --locked --manifest-path docs/plugins/todo/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path docs/plugins/todo/rust/Cargo.toml

      - name: Validate plugin contracts and examples
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          python3 -m venv "$RUNNER_TEMP/plugin-schema"
          plugin_schema_python="$RUNNER_TEMP/plugin-schema/bin/python"
          "$plugin_schema_python" -m pip install jsonschema==4.23.0 -r docs/plugins/requirements-sftp.txt -r docs/plugins/requirements-ftp-test.txt -r benchmarks/requirements.txt
          "$plugin_schema_python" docs/plugins/check_all.py --require-backends

      # The checks above play the host themselves. This starts every example in
      # a real persistent host, using the same Python environment for Paramiko.
      - name: Start every example in a real host
        working-directory: ${{ steps.candidate.outputs.source }}
        env:
          RUNYTE_EXAMPLE_PYTHON: ${{ runner.temp }}/plugin-schema/bin/python
        run: |
          set -o pipefail
          cargo test --locked --test persistent_host plugin_examples::every_example_plugin_registers_and_stays_running_in_a_real_host -- --ignored --exact | tee "$RUNNER_TEMP/plugin-examples.log"
          python3 -c 'import pathlib, sys; text = pathlib.Path(sys.argv[1]).read_text(); assert "test plugin_examples::every_example_plugin_registers_and_stays_running_in_a_real_host ... ok" in text, "required native example test did not run"' "$RUNNER_TEMP/plugin-examples.log"

      - name: Exercise two MCP clients against real editor hosts
        working-directory: ${{ steps.candidate.outputs.source }}
        env:
          RUNYTE_CONTEXT_TEST_BINARY: ${{ github.workspace }}/target/debug/runyte
        run: |
          test -x "$RUNYTE_CONTEXT_TEST_BINARY"
          "$RUNNER_TEMP/plugin-schema/bin/python" tests/mcp/run.py

      # Cargo's real-host integration test above builds this uninstrumented
      # default-feature debug binary. Reuse it only within this workflow run
      # and runner platform; no target directories or coverage objects travel.
      - name: Prepare tested host artifact
        env:
          HOST_VERSION: ${{ steps.candidate.outputs.host_version }}
        run: python3 .ci-tools/.github/scripts/plugin_host.py pack "$RUNNER_TEMP/plugin-host" "$CARGO_TARGET_DIR/debug/runyte" --version "$HOST_VERSION"
      - name: Share tested host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-host-${{ matrix.os }}
          path: ${{ runner.temp }}/plugin-host
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  ru-time:
    needs: [source, plugin-conformance]
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}ru-time moving head against this commit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Moving external development is advisory. Immutable supported plugins run
    # separately in the required frozen-plugin job below.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      # Nightlies test dev source with helpers from the workflow revision.
      # Keep the source tree and its own packaging invariants unchanged.
      - name: Check out CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: Keep helper checkout out of candidate source snapshots
        run: echo '/.ci-tools/' >> .git/info/exclude

      - name: Prepare the exact host or 0.4 candidate
        id: candidate
        run: python3 docs/plugins/compatibility/candidate.py --candidate-version 0.4.0 --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runyte/ru-time
          path: ru-time
          persist-credentials: false

      - name: Download this run's tested host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-host-${{ matrix.os }}
          path: ${{ runner.temp }}/plugin-host
      - name: Verify and install the tested host
        env:
          HOST_VERSION: ${{ steps.candidate.outputs.host_version }}
        run: python3 .ci-tools/.github/scripts/plugin_host.py restore "$RUNNER_TEMP/plugin-host" "$CARGO_TARGET_DIR/debug/runyte" --version "$HOST_VERSION"

      # RUNYTE_BIN enables ru-time's real-editor test, which is skipped otherwise.
      - name: Test ru-time
        working-directory: ru-time
        env:
          RUNYTE_BIN: ${{ github.workspace }}/target/debug/runyte
        run: python3 -m unittest discover -s tests -v

  plugin-inventory:
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Immutable plugin inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plugins: ${{ steps.pins.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false
          # Retained SDK source revisions must resolve to the recorded bytes.
          fetch-depth: 0
      - name: Validate retained profiles and immutable source provenance
        id: pins
        run: python3 docs/plugins/compatibility/check_inventory.py --verify-upstream --github-output "$GITHUB_OUTPUT"

  frozen-plugin:
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Frozen plugin ${{ matrix.plugin.id }} (${{ matrix.os }})
    needs: [source, plugin-inventory, plugin-conformance]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        plugin: ${{ fromJSON(needs.plugin-inventory.outputs.plugins) }}
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      # Nightlies test dev source with helpers from the workflow revision.
      # Keep the source tree and its own packaging invariants unchanged.
      - name: Check out CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: Keep helper checkout out of candidate source snapshots
        run: echo '/.ci-tools/' >> .git/info/exclude

      - name: Prepare the exact host or 0.4 candidate
        id: candidate
        run: python3 docs/plugins/compatibility/candidate.py --candidate-version 0.4.0 --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.plugin.repository }}
          ref: ${{ matrix.plugin.revision }}
          path: frozen-plugin
          persist-credentials: false
          fetch-depth: 0
      - name: Download this run's tested host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-host-${{ matrix.os }}
          path: ${{ runner.temp }}/plugin-host
      - name: Verify and install the tested host
        env:
          HOST_VERSION: ${{ steps.candidate.outputs.host_version }}
        run: python3 .ci-tools/.github/scripts/plugin_host.py restore "$RUNNER_TEMP/plugin-host" "$CARGO_TARGET_DIR/debug/runyte" --version "$HOST_VERSION"
      - name: Install isolated schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/frozen-schema"
          "$RUNNER_TEMP/frozen-schema/bin/python" -m pip install jsonschema==4.23.0
      - name: Verify frozen schemas, SDK and real editor behavior
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          "$RUNNER_TEMP/frozen-schema/bin/python" docs/plugins/compatibility/check_frozen.py --checkout "$GITHUB_WORKSPACE/frozen-plugin" --plugin '${{ matrix.plugin.id }}' --host-bin "$CARGO_TARGET_DIR/debug/runyte" --host-version '${{ steps.candidate.outputs.host_version }}'

  macos:
    # A failed source resolver must fail required checks, not skip them green.
    if: ${{ !cancelled() }}
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Tests (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Persistent-session and PTY tests spawn real child processes. Preserve
      # the async caller when a platform-specific lifecycle wait fails.
      RUST_BACKTRACE: 1
      # The default macOS temp directory is a long `/var/folders/...` path
      # whose canonical spelling starts with `/private`. Tests create many
      # path fixtures and Unix sockets below it, so use the short canonical
      # system temp directory to keep identities stable and socket paths valid.
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      # Nightlies test dev source with helpers from the workflow revision.
      # Keep the source tree and its own packaging invariants unchanged.
      - name: Check out CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: Keep helper checkout out of candidate source snapshots
        run: echo '/.ci-tools/' >> .git/info/exclude

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-macos-latest

      # PTY handling and terminal emulation are where macOS and Linux diverge,
      # so the suite runs in full here rather than just building.
      - name: Test with coverage and enforce the baseline
        uses: ./.ci-tools/.github/actions/core-coverage
        with:
          runner: macos-latest

  lifecycle-stress:
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Lifecycle stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUST_BACKTRACE: 1
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lifecycle-stress-${{ matrix.os }}

      # This is a burn-in gate, not a retry: `bash -e` stops on the first
      # failure, so every invocation and every attempt must pass. The suites
      # retain their normal parallelism and production deadlines.
      - name: Repeat process and PTY integration suites
        run: |
          set -o pipefail
          for attempt in {1..10}; do
            echo "burn-in attempt ${attempt}/10" | tee -a lifecycle-stress.log
            cargo test --locked --test local_protocol 2>&1 | tee -a lifecycle-stress.log
            cargo test --locked --test diagnostic_log 2>&1 | tee -a lifecycle-stress.log
            cargo test --locked --test persistent_host 2>&1 | tee -a lifecycle-stress.log
            cargo test --locked --test workspace_bulk 2>&1 | tee -a lifecycle-stress.log
          done

      - name: Upload lifecycle failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-stress-${{ matrix.os }}
          path: lifecycle-stress.log
          if-no-files-found: error
          retention-days: 14

  performance:
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: performance

      # Wall-clock budgets cannot distinguish a regression from sibling tests
      # taking the runner's CPU. Release mode is the user-facing build, and one
      # test thread gives every budget the machine rather than a noisy share.
      - name: Test serialized release budgets
        run: cargo test --release --locked --test performance -- --ignored --test-threads=1
      - name: Test serialized incremental reparse budget
        run: cargo test --release --locked --test syntax incremental_reparse_is_far_cheaper_than_a_full_parse -- --ignored --exact --test-threads=1

  floor:
    # A failed source resolver must fail required checks, not skip them green.
    if: ${{ !cancelled() }}
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}Release build floor (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Linux release artifacts are built on 22.04 so they inherit its glibc
      # 2.35 floor. This job is the early warning that the image still builds:
      # it fails on an ordinary push rather than during a release.
      - name: Build
        run: cargo build --release --locked

  msrv:
    # A failed source resolver must fail required checks, not skip them green.
    if: ${{ !cancelled() }}
    needs: source
    name: ${{ github.event_name == 'schedule' && 'Nightly ' || '' }}MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || '0000000000000000000000000000000000000000' }}
          persist-credentials: false

      # rustup ships on the runner image, so pinning a toolchain needs no
      # third-party action.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      # Keeps `rust-version = "1.88"` in Cargo.toml honest.
      - name: Check
        run: cargo +1.88 check -p runyte --all-targets --locked
