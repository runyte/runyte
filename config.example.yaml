# Copy to ~/.config/runyte/config.yaml.
editor:
  line_numbers: true
  tab_width: 4
  scroll_offset: 3
  # Cursor motions per held-key repeat event. Set to 1 for terminal-native speed.
  motion_repeat_multiplier: 2
  show_hidden_files: false # press . in an explorer to toggle for the session
  soft_wrap: false
  # Draw spaces as ·, tabs from →, and line endings as ↵.
  render_whitespace: false
  zen_width: 100
  hard_wrap_width: 80
  # The scratch buffer names no language, so Space p r refills it as Markdown.
  scratch_markdown: true
  # Gray out every pane's text while a command prompt is open.
  command_mode_dim: true

# Refresh visible Git views and tracked-file gutters automatically;
# :git-refresh remains available.
git:
  # Filesystem events refresh visible Git state no more often than this; the
  # same interval is the fallback when an event is lost.
  # Zero disables both watcher-triggered and fallback refreshes.
  refresh_interval_seconds: 60

# Where this workspace keeps its local runtime state: persistent-host
# transport and lock files. Keep this ignored. `root` is the original spelling
# and is still accepted.
workspace:
  state: .runyte
  # standalone is the default. persistent makes a bare `runyte` start or reuse
  # this project's host and attach to it.
  mode: standalone
  # A clean host with no TUI and no --wait request retires after this many
  # minutes. Zero disables retirement.
  idle_retirement_minutes: 1440

# Newest workspace-lifetime notifications retained in memory. Opening
# :notifications (alias :not) acknowledges the entries currently present.
notifications:
  history_limit: 50

# Remap built-in prefixes, descendants, and advertised aliases. Left sides
# always use default spellings; Leader and Window on right sides expand to the
# configured one-key prefixes. See "Key remapping" in docs/user-guide.md.
# keys:
#   leader: Ctrl-x
#   window: Ctrl-a
#   rebind:
#     Space g: Leader G
#     Space g l: Leader G c
#     Ctrl-w x: Window e
#     Space e: Space
#     ",": F12

# rust-analyzer is configured automatically. Other servers are keyed directly
# by Runyte's language name; see docs/lsp/ for copy-ready examples.
# lsp:
#   markdown:
#     command: marksman
#     args: ["server"]

# Built-ins: default-dark (the default), default-light, dark, light, base16,
# paper, gruvbox, atom-one-light, github-light, the four Catppuccin flavours,
# the six Everforest variants, the Nightfox pair and Terafox, and the Zenbones
# collection. Run `:theme` with no name to browse them all; docs/user-guide.md
# lists them.
theme: gruvbox

# Custom themes can be added here. Every color has a default, so fields may be
# omitted when only a small adjustment is needed.
themes:
  midnight:
    background: "#10131a"
    foreground: "#d8dee9"
    muted: "#65737e"
    # Optional marker colour; omitted derives a very dim colour from background.
    whitespace: "#292c33"
    # Optional ordinary-text colour while `gw` is active; omitted uses muted.
    # jump_text_muted: "#65737e"
    accent: "#88c0d0"
    # Command names in the command palette. Omitted uses accent, which also
    # colours pane and overlay borders; name it to let the two differ.
    command: "#8be9fd"
    # Carets and the status line distinguish modes. Omitted values use accent,
    # error, Runyte's neon Replace accent, warning, and info respectively; the
    # Replace accent switches to magenta if another mode already uses green.
    cursor_normal: "#ff5555"
    cursor_insert: "#ff79c6"
    cursor_replace: "#39ff14"
    cursor_select: "#ffb86c"
    cursor_command: "#bd93f9"
    directory: "#8be9fd"
    selection: "#2e3440"
    error: "#bf616a"
    warning: "#d08770"
    info: "#a3be8c"
    # Immediate `gw` keys are red. Two-key labels keep one neon-cyan hue;
    # make the secondary darker on dark themes and lighter on light themes.
    jump_label_immediate: "#ff5555"
    jump_label_primary: "#5fd7e7"
    jump_label_secondary: "#4ab7c6"
    # Git gutter marks, measured against the index. Omitted values use the
    # terminal's own green, yellow, and red.
    change_added: "#a3be8c"
    change_modified: "#ebcb8b"
    change_removed: "#bf616a"
